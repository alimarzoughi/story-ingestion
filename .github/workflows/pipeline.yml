name: Noiseproof pipeline

on:
  schedule:
    - cron: '7 * * * *'        # hourly, off the :00 rush
  workflow_dispatch:
    inputs:
      command:
        description: 'Pipeline command'
        type: choice
        default: run
        options: [run, verify-feeds, ingest, enrich, assign, merge, pairs, status, sync-sources, fix-text, recheck-stories]

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    # the one-off recheck re-verifies a few days of stories sequentially; everything else fits in 25 min
    timeout-minutes: ${{ github.event.inputs.command == 'recheck-stories' && 90 || 25 }}
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_ENRICH_MODEL: gpt-5-nano
      OPENAI_VERIFY_MODEL: gpt-5-mini
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run
        run: python -m pipeline.cli ${{ github.event.inputs.command || 'run' }} ${{ github.event.inputs.command == 'verify-feeds' && '--out source-audit.md' || '' }}
      - name: Upload source audit
        if: github.event.inputs.command == 'verify-feeds'
        uses: actions/upload-artifact@v4
        with:
          name: source-audit
          path: source-audit.md
